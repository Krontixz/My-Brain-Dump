<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="the brain dump of my life">
    <title>Zaki's Brain Dump</title>
    <style>
        body {
            font-family: Caveat, sans-serif;
            text-align: center;
            background-color: #1F51FF;
            color: #FF0000;
            padding-top: 50px;
        }
        h1 {
            margin-bottom: 10px;
        }
        h2 {
            font-weight: bold;
            color: #FFCC00;
            margin-bottom: 30px;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            cursor: pointer;
        }
        #bookmarklets {
            padding: 10px 15px;
            margin: 40px auto 20px auto;
            max-width: 640px;
        }
        .bookmarklet-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
        }
        #text-exporter {
            margin: 40px auto;
            max-width: 640px;
            padding: 10px 15px;
        }
        textarea {
            width: 100%;
            height: 200px;
            box-sizing: border-box;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #FFCC00;
            border-radius: 4px;
            background-color: #fff;
            color: #000;
            resize: vertical;
        }
        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-container button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            background-color: #FFCC00;
            color: #1F51FF;
            cursor: pointer;
        }
        .btn-container button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h1 id="main-header">ZAKI'S BRAIN DUMP</h1>
    
    <h2 id="secondary-header">
        This is the brain dump where i just code stuff<br>
        That i feel like doing when i am super bored.
    </h2>

    <select name="logdropdown" id="logDropdown" onchange="if(this.value) window.location.href=this.value;">
        <option value="" selected disabled>Log list ▾</option>
        <option value="logs/august2026/log1.html">Friday August 14 2026</option>
        <option value="logs/august2026/log2.html">Saturday August 15 2026</option>
        <option value="logs/august2026/log3.html">Sunday August 16 2026</option>
        <option value="logs/august2026.log4.html">Monday August 17 2026</option>
    </select>

    <section id="text-exporter">
        <textarea id="dumpInput" placeholder="Dump your thoughts or code here..."></textarea>
        <div class="btn-container">
            <button onclick="exportFile('txt', 'text/plain')">Plain Text</button>
            <button onclick="exportFile('md', 'text/markdown')">Markdown</button>
            <button onclick="exportFile('js', 'application/javascript')">JavaScript</button>
            <button onclick="exportFile('html', 'text/html')">HTML</button>
        </div>
    </section>

    <section id="bookmarklets">
        <div class="bookmarklet-container">
            <h2 class="bookmarklet-container-text">Grumpy Kaden Virus</h2>
            <figure>
                <img src="assets/grumpy-kaden.png" alt="the grumpy kaden">
                <figcaption>
                    <a href="javascript:(function(){var s=document.createElement('script');s.src='bookmarklets/grumpy-kaden.js';document.body.appendChild(s);})();">Grumpy Kaden</a> (Drag into bookmarklets)
                </figcaption>
            </figure>
        </div>
    </section>

    <script>
        function exportFile(extension, mimeType) {
            const text = document.getElementById('dumpInput').value;
            const blob = new Blob([text], { type: mimeType });
            const link = document.createElement('a');
            link.download = `dump.${extension}`;
            link.href = window.URL.createObjectURL(blob);
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(link.href);
        }
    </script>

</body>
</html>
